name: sawalove
description: Premium dating app for Cameroonians.
publish_to: 'none'

version: 1.0.1+3

environment:
  sdk: '>=3.5.0 <4.0.0'
  flutter: '>=3.24.0'

dependencies:
  flutter:
    sdk: flutter
  # State & Routing
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.7
  # UI
  google_fonts: ^6.3.2
  intl: ^0.20.2
  flutter_localizations:
    sdk: flutter
  cached_network_image: ^3.4.1
  # Media & Location
  image_picker: ^1.2.1
  geolocator: ^14.0.2
  google_maps_flutter: ^2.7.0
  geocoding: ^3.0.0
  permission_handler: ^12.0.1
  connectivity_plus: ^7.1.1
  # Chat media
  record: ^6.2.0
  just_audio: ^0.9.40
  # Storage
  shared_preferences: ^2.5.3
  path_provider: ^2.1.5
  pinput: ^6.0.2
  logger: ^2.0.2+1
  # Misc
  http: ^1.2.2
  crypto: ^3.0.5
  flutter_image_compress: ^2.3.0
  reorderable_grid: ^1.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

# path_provider_foundation >=2.5 depends on objective_c, whose build hook
# fails on Windows when the Flutter SDK path contains spaces (e.g.
# C:\Users\<first last>\...). Pin to the last method-channel version so
# `flutter test` does not need to build native assets.
dependency_overrides:
  path_provider_foundation: 2.4.1

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/branding/
  # L10n
