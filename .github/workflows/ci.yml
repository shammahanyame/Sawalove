# SawaLove CI
#
# Backend: boots the real PHP API against a real MySQL 8 service container and
# runs the full integration suite (55 assertions) plus the brute-force
# rate-limit enforcement test. See backend/php/tests/REGRESSIONS.md for the
# security regressions these tests permanently guard.
#
# Frontend: flutter analyze + flutter test.
#
# NOTE: the git repo root IS the Flutter app (pubspec.yaml lives at the
# repository root) — no `working-directory:` is needed, and backend paths
# like backend/php are relative to that same root.

name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  backend-tests:
    name: PHP API integration tests
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: sawalove_test
          MYSQL_USER: sawalove
          MYSQL_PASSWORD: testpass123
        ports:
          - 3307:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: pdo_mysql, curl, fileinfo
          coverage: none

      - name: Import database schema
        run: |
          mysql --host 127.0.0.1 --port 3307 -u sawalove -ptestpass123 \
            sawalove_test < backend/php/schema.sql

      - name: Start PHP API test server
        working-directory: backend/php
        run: |
          APP_ENV=local \
          APP_KEY=ci-test-key-not-for-production \
          OTP_DEBUG_RESPONSE=true \
          AUTH_RATE_LIMIT_MAX=1000 \
          DB_DSN="mysql:host=127.0.0.1;port=3307;dbname=sawalove_test" \
          DB_USER=sawalove \
          DB_PASSWORD=testpass123 \
          php -S 127.0.0.1:8110 -t public public/index.php > /tmp/api.log 2>&1 &

          # Wait for /health to come up
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8110/health | grep -q '"ok":true'; then
              echo "API is healthy"
              exit 0
            fi
            sleep 1
          done
          echo "API failed to become healthy"; cat /tmp/api.log; exit 1

      - name: Run integration suite (55 assertions)
        working-directory: backend/php
        env:
          DB_DSN: "mysql:host=127.0.0.1;port=3307;dbname=sawalove_test"
          DB_USER: sawalove
          DB_PASSWORD: testpass123
        run: php -d error_reporting="E_ALL & ~E_DEPRECATED" tests/run_api_tests.php

      - name: Run rate-limit enforcement test (fresh server, production defaults)
        working-directory: backend/php
        run: |
          APP_ENV=local \
          APP_KEY=ci-test-key-not-for-production \
          DB_DSN="mysql:host=127.0.0.1;port=3307;dbname=sawalove_test" \
          DB_USER=sawalove \
          DB_PASSWORD=testpass123 \
          php -S 127.0.0.1:8111 -t public public/index.php > /tmp/api-rl.log 2>&1 &

          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8111/health > /dev/null && break
            sleep 1
          done

          php -d error_reporting="E_ALL & ~E_DEPRECATED" \
            tests/run_rate_limit_test.php http://127.0.0.1:8111

      - name: Run DB-free security unit tests (30 assertions)
        working-directory: backend/php
        run: php tests/run_ai_security_unit_tests.php

      - name: Dump API server logs on failure
        if: failure()
        run: cat /tmp/api.log /tmp/api-rl.log 2>/dev/null || true

  frontend-tests:
    name: Flutter analyze + test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Pub get
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-pub

      - name: Test
        run: flutter test
