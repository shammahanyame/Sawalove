# SawaLove CI
#
# Backend: Supabase — SQL migrations are checked with squawk-style linting via
# the supabase CLI (db lint needs a linked project, so CI does a syntax check
# by applying migrations to a throwaway local Postgres) and Edge Functions are
# type-checked with deno check.
#
# Frontend: flutter analyze + flutter test.
#
# NOTE: the git repo root IS the Flutter app (pubspec.yaml lives at the
# repository root).

name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  supabase-checks:
    name: Supabase migrations + edge functions
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      # Apply every migration to a local postgres to guarantee the SQL parses
      # and runs in order. auth/storage schemas are stubbed with the parts the
      # migrations reference; on the real project Supabase provides them.
      - name: Apply migrations to local Postgres
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
          export PGPASSWORD=postgres
          psql -h 127.0.0.1 -U postgres -c "
            create schema if not exists auth;
            create schema if not exists storage;
            create table if not exists auth.users (
              id uuid primary key default gen_random_uuid(),
              phone text, email text,
              raw_user_meta_data jsonb not null default '{}'::jsonb
            );
            create table if not exists storage.buckets (
              id text primary key, name text, public boolean,
              file_size_limit bigint, allowed_mime_types text[]
            );
            create table if not exists storage.objects (
              id uuid primary key default gen_random_uuid(),
              bucket_id text, name text,
              created_at timestamptz default now()
            );
          "
          # cron schema is provided by the pg_cron extension on Supabase
          psql -h 127.0.0.1 -U postgres -c "create schema if not exists cron;"
          for f in supabase/migrations/*.sql; do
            echo "== $f"
            psql -h 127.0.0.1 -U postgres -v ON_ERROR_STOP=1 -f "$f" || exit 1
          done

      - name: Check edge functions compile (deno)
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: deno check
        run: deno check --config supabase/functions/import_map.json supabase/functions/*/index.ts || deno check supabase/functions/*/index.ts

  frontend-tests:
    name: Flutter analyze + test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Pub get
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-pub

      - name: Test
        run: flutter test
