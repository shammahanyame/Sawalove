<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;family=Be_Vietnam_Pro:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>

            darkMode: "class",

                        "on-primary-container": "#4b0027",
                        "primary": "#b30065",
                        "on-tertiary-fixed": "#002732",
                        "on-tertiary-container": "#003e4e",
                        "secondary-fixed": "#e7c5ff",
                        "on-error": "#ffefee",
                        "on-primary-fixed": "#000000",
                        "primary-container": "#ff6ea9",
                        "error-container": "#fb5151",
                        "surface-container-high": "#ffd8e5",
                        "on-error-container": "#570008",
                        "background": "#fff4f6",
                        "on-tertiary": "#e2f6ff",
                        "on-secondary-container": "#6c00b0",
                        "surface-bright": "#fff4f6",
                        "inverse-primary": "#ff479c",
                        "on-tertiary-fixed-variant": "#00485a",

                        "error": "#b31b25",

                        "secondary-container": "#e7c5ff",
                        "on-background": "#4a2134",
                        "on-surface": "#4a2134",
                        "surface-tint": "#b30065",
                        "outline-variant": "#d89cb4",
                        "on-secondary-fixed-variant": "#7716bc",
                        "inverse-surface": "#220213",
                        "surface": "#fff4f6",
                        "primary-dim": "#9d0058",
                        "surface-container-low": "#ffecf1",
                        "surface-variant": "#ffd1e1",
                        "tertiary-container": "#4dc9f1",
                        "surface-container": "#ffe0ea",
                        "inverse-on-surface": "#c68da3",
                        "tertiary-dim": "#00576c",
                        "on-primary": "#ffeff2",
                        "surface-container-lowest": "#ffffff",
                        "primary-fixed-dim": "#ff4e9e",

                    "borderRadius": {

                    "fontFamily": {
                        "headline": ["Plus Jakarta Sans"],
                        "body": ["Be Vietnam Pro"],
                        "label": ["Be Vietnam Pro"]
                    }
                },
            },
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        body {
            background-color: #fff4f6;
            color: #4a2134;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="font-body selection:bg-primary-container selection:text-on-primary-container">
<!-- TopAppBar -->
<header class="bg-[#fff4f6]/80 dark:bg-[#1a0b12]/80 backdrop-blur-md shadow-[0_12px_32px_rgba(74,33,52,0.08)] docked full-width top-0 rounded-b-[2rem] sticky z-50">
<div class="flex justify-between items-center px-6 h-16 w-full">
<button class="text-[#b30065] dark:text-[#ff6ea9] hover:bg-[#ffecf1] dark:hover:bg-[#2d141f] transition-colors p-2 rounded-full Active: scale-95 duration-200">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="font-['Plus_Jakarta_Sans'] font-bold tracking-tight text-xl text-[#b30065] dark:text-[#ff6ea9]">SawaLove</h1>
<button class="text-[#b30065] dark:text-[#ff6ea9] hover:bg-[#ffecf1] dark:hover:bg-[#2d141f] transition-colors p-2 rounded-full Active: scale-95 duration-200">
<span class="material-symbols-outlined" data-icon="help_outline">help_outline</span>
</button>
</div>
</header>
<main class="max-w-2xl mx-auto px-6 pt-12 pb-32">
<!-- Content Area -->
<div class="space-y-10">
<!-- User Header -->
<div class="flex flex-col items-center text-center space-y-4">
<div class="relative">
<div class="w-24 h-24 rounded-full border-4 border-surface-container-highest overflow-hidden">
<img alt="User Avatar" class="w-full h-full object-cover" data-alt="Close up portrait of a young African woman with glowing skin and braids against a soft pastel pink background" src="https://lh3.googleusercontent.com/aida-public/AB6AXuA0LU-dMLAkAfPOZtYpckP04WNXR-HG491Wka3YPfMEM7iujQXtadlItwkUvtndYKN_DqQn3eqMjikC8XiPRSoLLuGCpntU_ugnGIBLWIQ8uQ_YEbXMr_SlXSGLL2LWUAVuvZoXXTimyCux2G5Sd5l0ZXTmPN0w7ZrXcUMXVsayBDcP62CsPtKzn8yljsvavum_5-FO3eqo77z3mzxQWXC91dEH-sj4MfdCHxtQPvxLX_9QbBIQBNySB0oGeYJtW_ER337S6m43zCg"/>
</div>
<div class="absolute -bottom-1 -right-1 bg-error rounded-full p-1 border-4 border-surface shadow-sm">
<span class="material-symbols-outlined text-on-error text-sm" data-icon="report" style="font-variation-settings: 'FILL' 1;">report</span>
</div>
</div>
<div class="space-y-1">
<h2 class="font-headline text-2xl font-extrabold tracking-tight text-on-surface">Report Amara</h2>
<p class="text-on-surface-variant font-medium text-sm px-8">We take safety seriously. Please let us know why you are reporting this profile.</p>
</div>
</div>
<!-- Report Options -->
<div class="space-y-3">
<label class="block text-on-surface-variant font-label text-xs uppercase tracking-[0.15em] mb-4">Reason for report</label>
<button class="w-full flex items-center justify-between p-5 bg-surface-container-lowest rounded-lg border border-transparent hover:border-primary-container transition-all group active:scale-[0.98]">
<span class="font-semibold text-on-surface">Inappropriate Content</span>
<span class="material-symbols-outlined text-primary-container group-hover:text-primary transition-colors" data-icon="chevron_right">chevron_right</span>
</button>
<button class="w-full flex items-center justify-between p-5 bg-surface-container-lowest rounded-lg border border-transparent hover:border-primary-container transition-all group active:scale-[0.98]">
<span class="font-semibold text-on-surface">Spam/Fake Account</span>
<span class="material-symbols-outlined text-primary-container group-hover:text-primary transition-colors" data-icon="chevron_right">chevron_right</span>
</button>
<button class="w-full flex items-center justify-between p-5 bg-surface-container-lowest rounded-lg border border-transparent hover:border-primary-container transition-all group active:scale-[0.98]">
<span class="font-semibold text-on-surface">Harassment</span>
<span class="material-symbols-outlined text-primary-container group-hover:text-primary transition-colors" data-icon="chevron_right">chevron_right</span>
</button>
<button class="w-full flex items-center justify-between p-5 bg-surface-container-lowest rounded-lg border border-transparent hover:border-primary-container transition-all group active:scale-[0.98]">
<span class="font-semibold text-on-surface">Other</span>
<span class="material-symbols-outlined text-primary-container group-hover:text-primary transition-colors" data-icon="chevron_right">chevron_right</span>
</button>
</div>
<!-- Details Section -->
<div class="space-y-4">
<label class="block text-on-surface-variant font-label text-xs uppercase tracking-[0.15em]" for="details">Tell us more (optional)</label>
<textarea class="w-full bg-surface-container-lowest rounded-lg border-none focus:ring-2 focus:ring-primary p-5 text-on-surface placeholder:text-on-surface-variant/40 resize-none transition-all" id="details" placeholder="Provide additional context to help our safety team investigate..." rows="4"></textarea>
</div>
<!-- Safety Note -->
<div class="flex items-start gap-4 p-5 bg-surface-container-high/40 rounded-lg">
<span class="material-symbols-outlined text-primary mt-1" data-icon="shield" style="font-variation-settings: 'FILL' 1;">shield</span>
<p class="text-sm text-on-surface-variant leading-relaxed">
                    Your report is <strong class="text-on-surface">strictly confidential</strong>. Amara will not be notified that you reported them. This helps us maintain a vibrant and safe community for everyone.
                </p>
</div>
<!-- Action Button -->
<div class="pt-4">
<button class="w-full py-4 bg-primary text-on-primary rounded-full font-headline font-bold text-lg shadow-[0_12px_32px_rgba(179,0,101,0.2)] hover:bg-primary-dim transition-all active:scale-[0.97]">
                    Submit Report
                </button>
<button class="w-full py-4 mt-2 text-on-surface-variant font-semibold hover:text-primary transition-colors">
                    Cancel
                </button>
</div>
</div>
</main>
<!-- BottomNavBar (Suppressed due to transactional/focused flow) -->
<!-- Exclusion Rule applied: User is in a focused safety journey -->
</body></html>
