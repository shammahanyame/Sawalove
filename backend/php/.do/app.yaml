# DigitalOcean App Platform spec for the SawaLove PHP API.
# Deploy with:  doctl apps create --spec backend/php/.do/app.yaml
# or connect the repo in the App Platform dashboard and pick this spec.
#
# NOTE: never commit real secrets here — set APP_KEY, DB_PASSWORD etc. via
# `doctl apps update <id> --spec` with env types corrected to SECRET, or in
# the dashboard. The managed MySQL database block provisions a cluster and
# injects DATABASE_URL into the service environment.

name: sawalove-api
region: lon

services:
  - name: sawalove-api
    type: web
    http_port: 8080
    dockerfile_path: backend/php/Dockerfile
    source_dir: /
    instance_count: 1
    instance_size_slug: basic-xxs
    health_check:
      http_path: /health
      initial_delay_seconds: 15
      period_seconds: 30
      timeout_seconds: 5
      success_threshold: 1
      failure_threshold: 3
    envs:
      - key: APP_ENV
        value: production
        scope: RUN_AND_BUILD_TIME
      - key: APP_URL
        value: ${APP_DOMAIN}
        scope: RUN_AND_BUILD_TIME
      - key: APP_KEY
        type: SECRET
        value: SET_ME_VIA_DASHBOARD
        scope: RUN_AND_BUILD_TIME
      - key: DB_DSN
        value: ${sawalove-db.DATABASE_URL}
        scope: RUN_AND_BUILD_TIME
      - key: DB_USER
        value: ${sawalove-db.USERNAME}
        scope: RUN_AND_BUILD_TIME
      - key: DB_PASSWORD
        type: SECRET
        value: ${sawalove-db.PASSWORD}
        scope: RUN_AND_BUILD_TIME
      - key: DB_HOST
        value: ${sawalove-db.HOSTNAME}
        scope: RUN_AND_BUILD_TIME
      - key: DB_PORT
        value: ${sawalove-db.PORT}
        scope: RUN_AND_BUILD_TIME
      - key: DB_NAME
        value: ${sawalove-db.DATABASE}
        scope: RUN_AND_BUILD_TIME
      - key: API_PHONE_AUTH_ENABLED
        value: "true"
      - key: API_EMAIL_AUTH_ENABLED
        value: "true"
      - key: API_GOOGLE_AUTH_ENABLED
        value: "false"
      - key: API_APPLE_AUTH_ENABLED
        value: "false"
      - key: OTP_DEBUG_RESPONSE
        value: "false"
      - key: SMS_HTTP_URL
        type: SECRET
        value: SET_ME_VIA_DASHBOARD
      - key: SMS_HTTP_AUTH_HEADER
        type: SECRET
        value: SET_ME_VIA_DASHBOARD
      - key: AUTH_RATE_LIMIT_WINDOW
        value: "300"
      - key: AUTH_RATE_LIMIT_MAX
        value: "20"
      - key: MAX_UPLOAD_BYTES
        value: "5242880"

# Optional managed MySQL. Uncomment to let App Platform provision it and wire
# DATABASE_URL/USERNAME/PASSWORD/HOSTNAME/PORT/DATABASE into the service.
#
# databases:
#   - name: sawalove-db
#     engine: MYSQL
#     version: "8"
#     size: db-s-1vcpu-1gb
#     num_nodes: 1
