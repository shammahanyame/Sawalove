<span class="material-symbols-outlined text-on-primary text-4xl" style="font-variation-settings: 'FILL' 1;">bolt</span>
</div>
<!-- Decorative Star Elements -->
<span class="material-symbols-outlined absolute top-10 left-4 text-secondary text-2xl" style="font-variation-settings: 'FILL' 1;">auto_awesome</span>
<span class="material-symbols-outlined absolute bottom-12 right-2 text-primary text-xl" style="font-variation-settings: 'FILL' 1;">star</span>
</div>

<section class="space-y-4 mb-10">
<h1 class="text-[1.75rem] font-headline font-extrabold tracking-tight text-on-surface leading-tight">
                You're in the Spotlight!
            </h1>
<p class="text-on-surface-variant px-4 leading-relaxed font-medium">
                Your profile is now being prioritized for the next 30 minutes. Get ready for more likes!
            </p>
</section>

<div class="w-full bg-surface-container-low rounded-lg p-6 mb-12 flex flex-col items-center justify-center space-y-2">
<span class="font-label text-xs uppercase tracking-[0.2em] text-on-surface-variant/70 font-bold">Time Remaining</span>
<div class="text-5xl font-headline font-black text-primary tracking-widest tabular-nums">
