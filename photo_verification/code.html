<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .bg-radiant-soul {
            background: linear-gradient(135deg, #b30065 0%, #ff6ea9 100%);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>

<body class="bg-surface font-body text-on-surface selection:bg-primary-container selection:text-on-primary-container min-h-screen">
<!-- Top Navigation Shell -->
<header class="bg-[#fff4f6]/80 dark:bg-[#1a0b12]/80 backdrop-blur-md shadow-[0_12px_32px_rgba(74,33,52,0.08)] docked full-width top-0 rounded-b-[2rem] sticky z-50">
<div class="flex justify-between items-center px-6 h-16 w-full max-w-2xl mx-auto">
<button class="text-[#b30065] dark:text-[#ff6ea9] hover:bg-[#ffecf1] dark:hover:bg-[#2d141f] transition-colors p-2 rounded-full active:scale-95 duration-200">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="font-['Plus_Jakarta_Sans'] font-bold tracking-tight text-xl italic text-[#b30065] dark:text-[#ff6ea9]">SawaLove</h1>
<button class="text-[#b30065] dark:text-[#ff6ea9] hover:bg-[#ffecf1] dark:hover:bg-[#2d141f] transition-colors p-2 rounded-full active:scale-95 duration-200">
<span class="material-symbols-outlined" data-icon="help_outline">help_outline</span>
</button>
</div>
</header>
<main class="max-w-md mx-auto px-6 pt-8 pb-32">
<!-- Identity Header Section -->
<section class="text-center space-y-3 mb-10">
<div class="inline-flex items-center justify-center bg-primary-container/20 text-primary w-16 h-16 rounded-full mb-2">
<span class="material-symbols-outlined !text-3xl" data-icon="verified" style="font-variation-settings: 'FILL' 1;">verified</span>
</div>
<h2 class="text-[1.75rem] font-headline font-bold text-on-surface tracking-tight leading-tight">Verify Your Identity</h2>
<p class="text-on-surface-variant font-body leading-relaxed max-w-[280px] mx-auto">
                Take a quick selfie to get your blue checkmark and let others know you're real.
            </p>
</section>
<!-- Camera Canvas Section -->
<section class="relative mb-10">
<div class="aspect-[3/4] w-full rounded-lg bg-surface-container overflow-hidden shadow-[0_20px_48px_rgba(74,33,52,0.06)] flex items-center justify-center relative group">
<div class="absolute inset-0 bg-gradient-to-t from-on-surface/20 to-transparent opacity-60"></div>
<!-- Background Image Placeholder for Camera Preview -->
<img alt="Camera preview frame" class="w-full h-full object-cover grayscale opacity-30 mix-blend-overlay" data-alt="Blurred aesthetic close-up portrait of a person in a studio setting with warm cinematic backlighting and soft focus background" src="https://lh3.googleusercontent.com/aida-public/AB6AXuCZu6HvlmxJ9Scu5cCJ5HEC0pKXR5m6pQaj6JyEc8M1llEX8PP4clur3CcU2Lc1cIBUQOaGtIiHoP1_4DzCBvULfN56I-Vxg5NViPMLA2ThE2ICulFGIQenBR0tIFXBFMXxVt8O4XiEk_EnLmkrPd2YvXDmQUavU1R_f0VjdfJH1uCTvb-rUrBgEcZugYVMlKUw_LsHU1h_2imxp3TdjX7NeNEnqpk0edsG4_QSmZnO1gvHbMtxFTIzK2GlN-V3u2UvyViCdOMvIWo"/>
<!-- Camera UI Overlays -->
<div class="absolute inset-8 border-2 border-dashed border-white/40 rounded-lg pointer-events-none flex items-center justify-center">
<div class="w-48 h-64 border border-white/20 rounded-[50%] absolute flex items-center justify-center">
<span class="text-white/30 text-xs font-label uppercase tracking-widest mt-64">Align your face</span>
</div>
</div>
<div class="z-10 flex flex-col items-center">
<div class="bg-white/90 backdrop-blur-md p-6 rounded-full shadow-lg active:scale-90 transition-transform cursor-pointer">
<span class="material-symbols-outlined text-primary !text-4xl" data-icon="photo_camera">photo_camera</span>
</div>
</div>
</div>
</section>
<!-- Verification Rules (Bento Style) -->
<section class="grid grid-cols-2 gap-4 mb-10">
<!-- Do Card -->
<div class="bg-surface-container-lowest p-5 rounded-lg space-y-3">
<div class="flex items-center gap-2 text-tertiary">
<span class="material-symbols-outlined !text-xl" data-icon="check_circle" style="font-variation-settings: 'FILL' 1;">check_circle</span>
<span class="font-label font-bold text-[10px] uppercase tracking-widest">Good Lighting</span>
</div>
<div class="aspect-square rounded-md overflow-hidden bg-surface-container-low">
<img alt="Correct selfie example" class="w-full h-full object-cover" data-alt="A young man with glowing skin smiling naturally in bright daylight with a clear view of his eyes and face" src="https://lh3.googleusercontent.com/aida-public/AB6AXuD-ATZeAFmG1w603eNaGyRvtxwWiyg70TH8GNemU-Wq9UEbkga-pkF5hZz3k5xYb3xZ-RDJNt8dpwGiQKg8Qb_sqTtTtaRD2J216KihuNNjBZJCemsiKnY7ZxNg6Vvwp6Vw9YQFB_eQiUwhI2pVxA-4APTZuBCuVdzJHtDda2AbyqBV1DPlBAc-3QfZWsVNOLcLvz9WWWxn67rvhhK1AGZeRr8yBE4zvCL5PwCsYCjtSbV-5uzjfHP48goUuNHCGTfmshZSLJnCDNs"/>
</div>
</div>
<!-- Don't Card -->
<div class="bg-surface-container-lowest p-5 rounded-lg space-y-3">
<div class="flex items-center gap-2 text-error">
<span class="material-symbols-outlined !text-xl" data-icon="cancel" style="font-variation-settings: 'FILL' 1;">cancel</span>
<span class="font-label font-bold text-[10px] uppercase tracking-widest">No Sunglasses</span>
</div>
<div class="aspect-square rounded-md overflow-hidden bg-surface-container-low relative">
<img alt="Incorrect selfie example" class="w-full h-full object-cover grayscale opacity-60" data-alt="A person wearing large dark sunglasses and a hat that obscures their facial features in shadow" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBpfLLy63XjEIxzThgcA5-83aruG1yDpaKiMawIIczrJA6PfdMd9mmyuJYeate6hV679wiBBPc0bFvbJm-6XXNEXEFzW-2yy-eYS9zGwMKdKrB6qaqpZeJRClr7xbhKBvc8x5uIMPDY9Qp4Tw4wJA4JAKKA4jKsysPne2Xz4h_kf5VRKHY05hLk_0eR62rfpnEmInHJ8LXY_QwPAEhzqrGEVsKgbvZq-icVcand0dWHbgIbFXpyiI7516P_zlbY0YecwEd_nSAXHdo"/>
<div class="absolute inset-0 flex items-center justify-center">
<span class="material-symbols-outlined text-error !text-3xl" data-icon="block">block</span>
</div>
</div>
</div>
</section>
<!-- Action Buttons -->
<section class="space-y-4">
<button class="w-full bg-radiant-soul text-on-primary font-headline font-bold py-5 rounded-full shadow-[0_12px_32px_rgba(179,0,101,0.2)] active:scale-[0.98] transition-all text-center flex items-center justify-center gap-3">
<span class="material-symbols-outlined" data-icon="camera">camera</span>
                Take Photo
            </button>
<button class="w-full py-4 text-primary font-body font-semibold hover:bg-primary-container/10 rounded-full transition-colors active:scale-95">
                Skip for now
            </button>
</section>
<!-- Trust Indicator -->
<footer class="mt-8 text-center px-4">
<div class="flex items-center justify-center gap-2 text-on-surface-variant/60">
<span class="material-symbols-outlined text-[16px]" data-icon="lock" style="font-variation-settings: 'FILL' 1;">lock</span>
<span class="text-[10px] font-label uppercase tracking-[0.1em]">Your data is encrypted &amp; never shared</span>
</div>
</footer>
</main>
<!-- Bottom Navigation Component (Sub-page: Should be suppressed, but rendering to maintain shell relevance if it's considered top-level onboarding) -->
<!-- Applying Suppression Logic: This is a Task-Focused/Onboarding sub-page, navigation shell is suppressed to prioritize content canvas. -->
</body></html>
